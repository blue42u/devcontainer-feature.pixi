name: Publish feature

on:
  # Pick up new Pixi releases automatically.
  schedule:
    - cron: "23 5 * * *"
  # Publish a specific (or the latest) Pixi version on demand.
  workflow_dispatch:
    inputs:
      version:
        description: Pixi version to publish (e.g. 0.83.0). Empty for the latest release.
        type: string
        default: ""
      force:
        description: Republish even if this version already exists in the registry.
        type: boolean
        default: false
      verify-attestations:
        description: Verify GitHub artifact attestations (unavailable for some older Pixi releases).
        type: boolean
        default: true
  # Build (but never publish) to validate changes.
  pull_request:
  push:
    branches: [main]
    paths:
      - src/**
      - LICENSES/**
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  # Serialize publishes so the floating tags (X.Y, X, latest) are computed
  # against a consistent view of the registry.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  ORAS_VERSION: 1.3.6
  UPSTREAM: prefix-dev/pixi
  FEATURE_ID: pixi
  # Published as ghcr.io/<owner>/$NAMESPACE/$FEATURE_ID
  NAMESPACE: devcontainer-features
  # Architectures supported by src/install.sh. Entries marked "required" fail
  # the build when missing from a release, others only emit a warning.
  TARGETS: |
    x86_64-unknown-linux-musl required
    aarch64-unknown-linux-musl required
    riscv64gc-unknown-linux-gnu optional

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Resolve Pixi version and image reference
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            version="$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)"
            version="${version#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid Pixi version: '$version'"
            exit 1
          fi
          # <registry>/<namespace>/<id>: the last path segment must be the
          # feature id. OCI repository names must be lowercase.
          image="ghcr.io/${OWNER,,}/$NAMESPACE/$FEATURE_ID"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Pixi $version -> $image"

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        env:
          ACTOR: ${{ github.actor }}
        run: oras login ghcr.io --username "$ACTOR" --password-stdin <<< "$GH_TOKEN"

      - name: Check whether this version is already published
        id: exists
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          FORCE: ${{ inputs.force || false }}
        run: |
          if oras manifest fetch --descriptor "$IMAGE:$VERSION" > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "::notice::$IMAGE:$VERSION exists, republishing (force)"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::$IMAGE:$VERSION already published, nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify Pixi release artifacts
        if: steps.exists.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERIFY_ATTESTATIONS: ${{ github.event_name != 'workflow_dispatch' || inputs.verify-attestations }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mkdir -p downloads build/dist
          assets="$(gh release view "$tag" --repo "$UPSTREAM" --json assets --jq '.assets[].name')"

          while read -r target requirement; do
            [ -n "$target" ] || continue
            archive="pixi-$target.tar.gz"
            if ! grep -qxF "$archive" <<< "$assets"; then
              if [ "$requirement" = required ]; then
                echo "::error::$archive is missing from Pixi $tag"
                exit 1
              fi
              echo "::warning::$archive is missing from Pixi $tag, skipping $target"
              continue
            fi

            gh release download "$tag" --repo "$UPSTREAM" --dir downloads \
              --pattern "$archive" --pattern "$archive.sha256"
            (cd downloads && sha256sum --check --strict "$archive.sha256")
            if [ "$VERIFY_ATTESTATIONS" = "true" ]; then
              # Pixi uses GitHub immutable releases, whose attestations have the
              # release predicate (https://in-toto.io/attestation/release/v0.2),
              # not SLSA build provenance, so `gh attestation verify` finds none.
              gh release verify-asset "$tag" "downloads/$archive" --repo "$UPSTREAM"
            fi

            # Each archive contains a single "pixi" executable.
            mkdir "downloads/$target"
            tar -xzf "downloads/$archive" -C "downloads/$target" pixi
            install -m 0755 "downloads/$target/pixi" "build/dist/pixi-$target"
          done <<< "$TARGETS"

          # Pixi is BSD-3-Clause, which requires its notice to accompany binaries.
          mkdir -p build/LICENSES
          gh api "repos/$UPSTREAM/contents/LICENSE?ref=$tag" \
            -H "Accept: application/vnd.github.raw" > build/LICENSES/pixi-BSD-3-Clause.txt

          ls -l build/dist

      - name: Assemble feature archive
        if: steps.exists.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          install -m 0755 src/install.sh build/install.sh
          sed "s/@VERSION@/$VERSION/g" src/devcontainer-feature.json > build/devcontainer-feature.json
          cp LICENSES/MIT.txt build/LICENSES/MIT.txt

          # Sanity-check the metadata before shipping it.
          jq -e --arg id "$FEATURE_ID" --arg v "$VERSION" \
            '.id == $id and .version == $v' build/devcontainer-feature.json > /dev/null
          if grep -rq '@VERSION@' build/devcontainer-feature.json; then
            echo "::error::Unsubstituted @VERSION@ in devcontainer-feature.json"
            exit 1
          fi

          # Reproducible tarball: stable order, ownership and timestamps.
          # The layer file name is mandated by the distribution spec. Despite the
          # .tgz extension the layer must be an *uncompressed* tar, as its media
          # type (application/vnd.devcontainers.layer.v1+tar) says; some clients
          # (e.g. Zed) do not decompress it.
          mtime="$(git log -1 --format=%ct)"
          tar --create --file "devcontainer-feature-$FEATURE_ID.tgz" --directory build \
            --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            devcontainer-feature.json install.sh dist LICENSES
          if gzip --test "devcontainer-feature-$FEATURE_ID.tgz" 2>/dev/null; then
            echo "::error::Feature layer must not be gzip-compressed"
            exit 1
          fi
          tar -tvf "devcontainer-feature-$FEATURE_ID.tgz"

          # Manifest config: an empty JSON object, as produced by the reference
          # implementation.
          printf '{}' > config.json

          # Manifest annotations. dev.containers.metadata carries the feature
          # metadata so tools can read it without pulling the layer.
          jq -n \
            --arg metadata "$(jq -c . build/devcontainer-feature.json)" \
            --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg version "$VERSION" \
            '{"$manifest": {
              "dev.containers.metadata": $metadata,
              "com.github.package.type": "devcontainer_feature",
              "org.opencontainers.image.source": $source,
              "org.opencontainers.image.version": $version,
              "org.opencontainers.image.description": "Pixi package manager as a Devcontainer feature",
              "org.opencontainers.image.licenses": "MIT AND BSD-3-Clause"
            }}' > annotations.json
          cat annotations.json

      - name: Upload feature archive
        if: steps.exists.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devcontainer-feature-${{ env.FEATURE_ID }}-${{ steps.meta.outputs.version }}
          path: |
            devcontainer-feature-${{ env.FEATURE_ID }}.tgz
            annotations.json
          if-no-files-found: error

      - name: Compute tags
        id: tags
        if: env.PUBLISH == 'true' && steps.exists.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Floating tags (X.Y, X, latest) only move forward, so publishing an
          # older release never clobbers a newer one.
          if ! existing="$(oras repo tags "$IMAGE" 2>&1)"; then
            echo "::warning::Could not list tags for $IMAGE (first publish?): $existing"
            existing=""
          fi
          all="$( { printf '%s\n' "$VERSION"; printf '%s\n' "$existing"; } \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV)"

          is_newest() { [ "$(grep -E "^$1" <<< "$all" | tail -n1)" = "$VERSION" ]; }
          IFS=. read -r major minor _ <<< "$VERSION"
          tags="$VERSION"
          if is_newest "$major\\.$minor\\."; then tags+=",$major.$minor"; fi
          if is_newest "$major\\."; then tags+=",$major"; fi
          if is_newest ""; then tags+=",latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"

      - name: Push to ghcr.io
        if: env.PUBLISH == 'true' && steps.exists.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          # Passing --config without --artifact-type makes ORAS emit an OCI
          # image manifest matching the Devcontainer distribution spec:
          #   config: application/vnd.devcontainers
          #   layer:  application/vnd.devcontainers.layer.v1+tar
          oras push "$IMAGE:$TAGS" \
            --config config.json:application/vnd.devcontainers \
            --annotation-file annotations.json \
            "devcontainer-feature-$FEATURE_ID.tgz:application/vnd.devcontainers.layer.v1+tar"
          oras manifest fetch --pretty "$IMAGE:${TAGS%%,*}"

      - name: Log out of ghcr.io
        if: always() && env.PUBLISH == 'true'
        run: oras logout ghcr.io || true
